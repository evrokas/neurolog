---
table:
  name: companies
  class: companiesClass

  fields:
  - name: name
    type: varchar(96)
    required: true

  - name: name_match
    type: varchar(96)

  - name: supplies
    type: text

  - name: apyweb_name
    type: varchar(150)

  - name: active
    type: boolean
    default: 1

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: udate
    type: datetime

  - name: uuser
    type: char(32)

...

# Companies that supply the group: implants, equipment, services, consumables (admin list, like hospitals). A company is switched off (active = 0), never deleted.
# - name_match  uppercase without accents, for matching a name typed in the quick line
# - supplies    JSON list of field.company.supplies codes; empty = offered for everything (docs/plans/suppliers.md)
# - apyweb_name company name as written in APYweb (bin/import_apyweb_companies.php matches on it first)
