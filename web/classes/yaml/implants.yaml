---
table:
  name: implants
  class: implantsClass

  fields:
  - name: op_ref
    type: int
    required: true

  - name: implant_category
    type: varchar(40)

  - name: implant_count
    type: int

  - name: manufacturer
    type: varchar(64)

  - name: valve_type
    type: varchar(16)

  - name: valve_setting
    type: varchar(64)

  - name: guidance
    type: text

  - name: screws_robot_placed
    type: int

  - name: screw_breach
    type: text

  - name: fluoroscopy_time_s
    type: int

  - name: adjuncts
    type: text

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: udate
    type: datetime

  - name: uuser
    type: char(32)

...

# Implant type and guidance used in an operation; category and maker, never lot numbers.
# guidance, adjuncts: JSON lists; screw_breach: JSON list of Gertzbein-Robbins grades (A–E)
