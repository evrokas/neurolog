---
table:
  name: implants
  class: implantsClass

  fields:
  - name: op_ref
    type: int
    required: true

  - name: sort
    type: int

  - name: procedure_ref
    type: int

  - name: implant_category
    type: varchar(40)

  - name: implant_count
    type: int

  - name: company_ref
    type: int

  - name: product
    type: varchar(96)

  - name: level_from
    type: varchar(4)

  - name: level_to
    type: varchar(4)

  - name: levels_list
    type: text

  - name: region
    type: varchar(40)

  - name: side
    type: varchar(12)

  - name: params
    type: text

  - name: coding_status
    type: varchar(12)

  - name: coded_by
    type: varchar(32)

  - name: coded_at
    type: datetime

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: udate
    type: datetime

  - name: uuser
    type: char(32)

...

# One group of identical implants used in an operation (docs/plans/m4.md A): category, company, product, count,
# levels, side, and the parameters of its category (vocab/implants.yaml) as JSON, e.g. {"diameter_mm":6.5,"length_mm":45}.
# No lot or serial numbers: traceability stays in the hospital record (decision kept 2026-11-18).
# - procedure_ref  the procedure row the implant belongs to (optional)
