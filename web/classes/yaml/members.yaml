---
table:
  name: members
  class: membersClass

  fields:
  - name: name
    type: varchar(128)
    required: true

  - name: kind
    type: varchar(16)
    required: true

  - name: uname
    type: varchar(32)

  - name: apyweb_name
    type: varchar(255)

  - name: active
    type: boolean
    default: 1

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: udate
    type: datetime

  - name: uuser
    type: char(32)

...

# Group members and other staff named on operations (admin list).
# - kind   surgeon | anaesthetist | resident | external
# - uname  users.uname of the member's NeuroLog account, if any (a surgeon confirms codes of own cases)
